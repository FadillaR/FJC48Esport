<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FJC48 Esport | Kalender (Perbaikan)</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header -->
  <header class="bg-gray-900 text-yellow-400 py-6 shadow-md text-center">
    <h1 class="text-3xl font-bold tracking-wide">🏆 FJC48 ESPORT</h1>
    <p class="text-gray-300 mt-1">Kalender Jadwal Turnamen & Latihan</p>
  </header>

  <main class="max-w-6xl mx-auto mt-10 bg-white p-6 rounded-2xl shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">📅 Kalender Kegiatan</h2>
      <div class="flex gap-2">
        <button id="addEventBtn" class="bg-yellow-400 text-black px-4 py-2 rounded-lg hover:bg-yellow-300 font-semibold">+ Tambah Event</button>
        <button id="clearAllBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-400 font-semibold">Reset Semua</button>
      </div>
    </div>
    <div id="calendar"></div>
  </main>

  <!-- Modal Tambah/Edit Event -->
  <div id="eventModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white rounded-xl p-6 w-96 shadow-xl">
      <h3 id="modalTitle" class="text-lg font-bold mb-4">Tambah Event Baru</h3>
      <form id="eventForm" class="space-y-3">
        <input type="hidden" id="eventId" value="">
        <div>
          <label class="block font-medium">Nama Event</label>
          <input type="text" id="eventTitle" class="w-full border p-2 rounded" required>
        </div>
        <div>
          <label class="block font-medium">Tanggal</label>
          <input type="date" id="eventDate" class="w-full border p-2 rounded" required>
        </div>
        <div>
          <label class="block font-medium">Divisi</label>
          <select id="eventDivision" class="w-full border p-2 rounded">
            <option value="Free Fire">🔥 Free Fire</option>
            <option value="Mobile Legends">⚔️ Mobile Legends</option>
            <option value="Gabungan">💪 Gabungan</option>
          </select>
        </div>
        <div>
          <label class="block font-medium">Deskripsi</label>
          <textarea id="eventDesc" class="w-full border p-2 rounded" rows="3" placeholder="Contoh: Sparring dengan EVOS Esport"></textarea>
        </div>
        <div class="flex justify-between pt-2">
          <div class="flex gap-2">
            <button type="button" id="cancelEvent" class="px-3 py-2 bg-gray-300 rounded hover:bg-gray-400">Batal</button>
            <button type="submit" id="saveEventBtn" class="px-3 py-2 bg-yellow-400 text-black rounded font-semibold hover:bg-yellow-300">Simpan</button>
          </div>
          <button type="button" id="deleteEventBtn" class="hidden px-3 py-2 bg-red-500 text-white rounded hover:bg-red-400" title="Hapus event ini">Hapus</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detail Event -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-40">
    <div class="bg-white rounded-xl p-6 w-80 shadow-xl">
      <h3 id="detailTitle" class="text-lg font-bold mb-2"></h3>
      <p id="detailDate" class="text-gray-500 mb-2"></p>
      <p id="detailDivision" class="font-semibold mb-2"></p>
      <p id="detailDesc" class="text-gray-700 mb-4"></p>
      <div class="flex gap-2">
        <button id="editFromDetail" class="flex-1 bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-300 font-semibold">Edit</button>
        <button id="closeDetail" class="flex-1 bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 py-6">
    © 2025 FJC48 Esport. Semua Hak Dilindungi.
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // Helpers
  const uid = () => 'id-' + Math.random().toString(36).slice(2, 9);

  const colorMap = {
    "Free Fire": "#f87171",
    "Mobile Legends": "#60a5fa",
    "Gabungan": "#fbbf24"
  };

  // LocalStorage helpers
  const LS_KEY = 'fjc48_events_v2';
  const loadEventsFromStorage = () => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      // ensure each event has id and start in ISO date (yyyy-mm-dd)
      return arr.map(ev => ({
        id: ev.id || uid(),
        title: ev.title || 'Untitled',
        start: (ev.start || ev.date || ev.startStr || '').slice(0,10),
        color: ev.color || colorMap[ev.divisi] || '#34d399',
        extendedProps: {
          divisi: ev.divisi || '-',
          deskripsi: ev.deskripsi || ev.desc || ''
        }
      }));
    } catch (e) {
      console.error('Gagal baca dari localStorage', e);
      return [];
    }
  };
  const saveEventsToStorage = (eventsArray) => {
    // store a simplified version (no functions)
    const toStore = eventsArray.map(ev => ({
      id: ev.id,
      title: ev.title,
      start: (ev.start || '').slice(0,10),
      color: ev.color,
      divisi: ev.extendedProps?.divisi || ev.divisi || '',
      deskripsi: ev.extendedProps?.deskripsi || ev.deskripsi || ''
    }));
    localStorage.setItem(LS_KEY, JSON.stringify(toStore));
  };

  // Calendar init
  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'id',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,listWeek'
    },
    buttonText: {
      today: 'Hari Ini',
      month: 'Bulan',
      week: 'Minggu',
      list: 'Daftar'
    },
    events: [], // will load below
    eventClick: function(info) {
      const ev = info.event;
      const title = ev.title || 'Untitled';
      // event.start may be Date or null; use startStr fallback
      const dateStr = ev.start ? ev.start.toLocaleDateString('id-ID') : (ev.startStr || ev.extendedProps?.start || '');
      document.getElementById('detailTitle').innerText = title;
      document.getElementById('detailDate').innerText = 'Tanggal: ' + (dateStr || '-');
      document.getElementById('detailDivision').innerText = 'Divisi: ' + (ev.extendedProps?.divisi || '-');
      document.getElementById('detailDesc').innerText = ev.extendedProps?.deskripsi || 'Tidak ada deskripsi.';
      // store currently selected id for editing
      document.getElementById('detailModal').dataset.eventId = ev.id;
      document.getElementById('detailModal').classList.remove('hidden');
    }
  });
  calendar.render();

  // Load initial events safely (avoid duplicates)
  function reloadEventsIntoCalendar() {
    const arr = loadEventsFromStorage();
    calendar.removeAllEvents();
    arr.forEach(ev => {
      // FullCalendar accepts start as ISO string yyyy-mm-dd
      calendar.addEvent({
        id: ev.id,
        title: ev.title,
        start: ev.start,
        color: ev.color,
        extendedProps: ev.extendedProps
      });
    });
  }
  reloadEventsIntoCalendar();

  // UI elements
  const addEventBtn = document.getElementById('addEventBtn');
  const eventModal = document.getElementById('eventModal');
  const modalTitle = document.getElementById('modalTitle');
  const eventForm = document.getElementById('eventForm');
  const cancelEvent = document.getElementById('cancelEvent');
  const deleteEventBtn = document.getElementById('deleteEventBtn');
  const eventIdInput = document.getElementById('eventId');
  const eventTitleInput = document.getElementById('eventTitle');
  const eventDateInput = document.getElementById('eventDate');
  const eventDivisionInput = document.getElementById('eventDivision');
  const eventDescInput = document.getElementById('eventDesc');

  const detailModal = document.getElementById('detailModal');
  const closeDetail = document.getElementById('closeDetail');
  const editFromDetail = document.getElementById('editFromDetail');

  const clearAllBtn = document.getElementById('clearAllBtn');

  // open add modal
  addEventBtn.addEventListener('click', () => {
    modalTitle.innerText = 'Tambah Event Baru';
    eventIdInput.value = '';
    eventForm.reset();
    deleteEventBtn.classList.add('hidden');
    eventModal.classList.remove('hidden');
  });

  // cancel
  cancelEvent.addEventListener('click', () => eventModal.classList.add('hidden'));

  // submit (add or edit)
  eventForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = eventIdInput.value || uid();
    const title = eventTitleInput.value.trim();
    const date = eventDateInput.value;
    const divisi = eventDivisionInput.value;
    const deskripsi = eventDescInput.value.trim();

    if (!title || !date) {
      alert('Mohon isi nama event dan tanggal.');
      return;
    }

    const color = colorMap[divisi] || '#34d399';

    // create event object
    const evObj = {
      id,
      title,
      start: date,
      color,
      extendedProps: {
        divisi,
        deskripsi
      }
    };

    // update calendar & storage
    const stored = loadEventsFromStorage();

    // check if edit (id exists)
    const idx = stored.findIndex(x => x.id === id);
    if (idx >= 0) {
      stored[idx] = {
        id,
        title,
        start: date,
        color,
        divisi,
        deskripsi
      };
      // update event in calendar
      const existing = calendar.getEventById(id);
      if (existing) {
        existing.setProp('title', title);
        existing.setStart(date);
        existing.setProp('color', color);
        existing.setExtendedProp('divisi', divisi);
        existing.setExtendedProp('deskripsi', deskripsi);
      } else {
        calendar.addEvent(evObj);
      }
    } else {
      // add new
      stored.push({
        id, title, start: date, color, divisi, deskripsi
      });
      calendar.addEvent(evObj);
    }

    saveEventsToStorage(stored);
    eventModal.classList.add('hidden');
  });

  // When clicking an event's detail -> Edit
  editFromDetail.addEventListener('click', () => {
    const evId = detailModal.dataset.eventId;
    const ev = calendar.getEventById(evId);
    if (!ev) return alert('Event tidak ditemukan.');
    // fill modal with event data
    modalTitle.innerText = 'Edit Event';
    eventIdInput.value = ev.id;
    eventTitleInput.value = ev.title || '';
    // use startStr fallback
    eventDateInput.value = ev.start ? ev.start.toISOString().slice(0,10) : (ev.startStr || '');
    eventDivisionInput.value = ev.extendedProps?.divisi || '';
    eventDescInput.value = ev.extendedProps?.deskripsi || '';
    deleteEventBtn.classList.remove('hidden');
    detailModal.classList.add('hidden');
    eventModal.classList.remove('hidden');
  });

  // Close detail modal
  closeDetail.addEventListener('click', () => detailModal.classList.add('hidden'));

  // Delete event (from edit modal)
  deleteEventBtn.addEventListener('click', () => {
    const id = eventIdInput.value;
    if (!id) return;
    if (!confirm('Hapus event ini?')) return;
    // remove from storage
    const stored = loadEventsFromStorage().filter(x => x.id !== id);
    saveEventsToStorage(stored);
    // remove from calendar
    const ev = calendar.getEventById(id);
    if (ev) ev.remove();
    eventModal.classList.add('hidden');
  });

  // Reset semua event (danger)
  clearAllBtn.addEventListener('click', () => {
    if (!confirm('Reset semua jadwal? Ini akan menghapus semua event yang tersimpan di browser.')) return;
    localStorage.removeItem(LS_KEY);
    calendar.removeAllEvents();
    alert('Semua event telah dihapus.');
  });

  // Close modals by clicking outside modal content
  document.addEventListener('click', (e) => {
    // close add/edit modal when clicking overlay
    if (e.target === eventModal) eventModal.classList.add('hidden');
    if (e.target === detailModal) detailModal.classList.add('hidden');
  });

  // Save to storage on window unload to be safe (collect current events)
  window.addEventListener('beforeunload', () => {
    const current = calendar.getEvents().map(ev => ({
      id: ev.id,
      title: ev.title,
      start: ev.startStr ? ev.startStr.slice(0,10) : (ev.start ? ev.start.toISOString().slice(0,10) : ''),
      color: ev.backgroundColor || ev.extendedProps?.color || '',
      divisi: ev.extendedProps?.divisi || '',
      deskripsi: ev.extendedProps?.deskripsi || ''
    }));
    localStorage.setItem(LS_KEY, JSON.stringify(current));
  });
});
</script>

</body>
</html>
